services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py setup_schedules &&
             python manage.py runserver 0.0.0.0:8000"

  qcluster:
    build:
      context: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py qcluster"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=${PGDATA}
    volumes:
      - library_db:${PGDATA}

volumes:
  library_db:
